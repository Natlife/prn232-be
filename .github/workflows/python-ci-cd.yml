name: Python AI Microservice CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "merge/v3" ]
  pull_request:
    branches: [ "main", "master", "merge/v3" ]

jobs:
  test-and-lint:
    name: Test & Validate Python Microservice
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Pytest Suite
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio httpx fastapi pydantic openai
        if [ -d "../python_service/tests" ]; then
          python -m pytest ../python_service/tests/ --verbosity=detailed
        else
          echo "Python tests directory not found in this repo root, skipping."
        fi
